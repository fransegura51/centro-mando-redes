<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest-ventas.json">
  <link rel="icon" type="image/png" href="icon-ventas-192.png">
  <link rel="apple-touch-icon" href="icon-ventas-192.png">
  <title>Centro de Mando de Ventas</title>
  <style>
    :root { --fondo: #f1f5f4; --tarjeta: #fff; --texto: #111827; --suave: #6b7280; --borde: #e5e7eb;
      --primario: #0f766e; --ok: #15803d; --aviso: #b45309; --error: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); font-size: 16px; }
    header { background: #0f766e; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header a { color: #fff; font-size: .85rem; text-decoration: none; border: 1px solid #5eead4; border-radius: 6px; padding: 6px 10px; }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    [hidden] { display: none !important; }
    .pestanas { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 14px; padding-bottom: 4px; }
    .pestanas button { white-space: nowrap; background: #fff; border: 1px solid var(--borde); border-radius: 8px; padding: 10px 14px; font-size: 1rem; cursor: pointer; }
    .pestanas button.activa { background: var(--primario); color: #fff; border-color: var(--primario); }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin: 10px 0; }
    .kpi { background: #fff; border-left: 5px solid var(--primario); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; }
    .kpi b { font-size: 1.6rem; } .kpi span { font-size: .8rem; color: var(--suave); }
    .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
    .tarjeta h3 { margin: 0 0 4px; font-size: 1rem; }
    .tarjeta small, .suave { color: var(--suave); }
    .estado { display: inline-block; font-size: .78rem; padding: 2px 8px; border-radius: 999px; background: #e5e7eb; margin-right: 6px; }
    .estado.borrador, .estado.por_contactar { background: #fef9c3; }
    .estado.enviado, .estado.contactado { background: #dbeafe; }
    .estado.pendiente_ti { background: #fee2e2; color: #991b1b; font-weight: 700; }
    .estado.recibido { background: #e5e7eb; }
    .estado.respondido, .estado.respondio, .estado.interesado { background: #dcfce7; }
    .estado.no_interesa, .estado.baja { background: #fee2e2; }
    .estado.pendiente { background: #fef9c3; } .estado.invitado { background: #dcfce7; }
    .acciones { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    button.principal, button.secundario { font: inherit; border-radius: 8px; padding: 9px 12px; cursor: pointer; border: 1px solid var(--primario); }
    button.principal { background: var(--primario); color: #fff; } button.secundario { background: #fff; color: var(--primario); }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
    .chips button { background: #fff; border: 1px solid var(--borde); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
    .chips button.activa { background: #ccfbf1; border-color: var(--primario); }
    details { margin-top: 8px; } summary { cursor: pointer; color: var(--primario); }
    pre { white-space: pre-wrap; background: #f8fafc; border: 1px solid var(--borde); border-radius: 8px; padding: 8px; font: inherit; font-size: .92rem; }
    form.nuevo { display: flex; flex-direction: column; gap: 6px; padding: 8px 0; }
    form.nuevo input, form.nuevo select, form.nuevo textarea { font: inherit; padding: 9px; border: 1px solid #ccc; border-radius: 8px; width: 100%; }
    .barra { background: #e5e7eb; border-radius: 999px; height: 14px; overflow: hidden; } .barra i { display: block; height: 100%; background: var(--primario); }
    .aviso { background: #fef3c7; border: 1px solid #f59e0b; border-radius: 8px; padding: 8px 12px; margin: 10px 0; }
    .vacio { color: var(--suave); text-align: center; padding: 20px 0; }
  </style>
</head>
<body>
  <header>
    <h1>📈 Ventas · Pepo</h1>
    <a href="produccion.html">Producción</a>
  </header>
  <main>
    <div id="aviso" class="aviso" hidden></div>
    <p id="cargando">Cargando…</p>
    <div id="contenido" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const CONFIG = window.CMR_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });
    const NICHOS = { ampa: 'AMPA / colegios', familias_numerosas: 'Familias numerosas', crianza: 'Crianza (blogs y creadores)', custodia: 'Custodia compartida', otros: 'Otros' };
    const EST_CONTACTO = { por_contactar: 'Por contactar', contactado: 'Contactado', respondio: 'Respondió', interesado: 'Interesado', no_interesa: 'No le interesa', baja: 'Baja (no escribir más)' };
    const EST_CORREO = { borrador: 'Borrador', enviado: 'Enviado', respondido: 'Respondido', pendiente_ti: 'Necesita tu respuesta', recibido: 'Recibido' };
    let vista = 'resumen', filtro = 'todos';
    let contactos = [], correos = [], espera = [];

    const escapar = (t) => String(t == null ? '' : t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fecha = (f) => f ? new Date(f).toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }) : '';
    const avisar = (t) => { $('aviso').textContent = t || ''; $('aviso').hidden = !t; };

    async function cargar() {
      const [a, b, c] = await Promise.all([
        sb.from('ventas_contactos').select('*').order('creado_en', { ascending: false }),
        sb.from('ventas_correos').select('*').order('creado_en', { ascending: false }),
        sb.from('lista_espera').select('*').order('fecha', { ascending: false }),
      ]);
      const err = a.error || b.error || c.error;
      if (err) avisar('No se pudieron cargar los datos: ' + err.message); else avisar('');
      contactos = a.data || []; correos = b.data || []; espera = c.data || [];
      $('cargando').hidden = true; $('contenido').hidden = false;
      pintar();
    }

    function pestanas() {
      const t = [['resumen', '📊 Resumen'], ['correos', `✉️ Correos (${correos.length})`], ['contactos', `🏢 Contactos (${contactos.length})`], ['espera', `📬 Lista de espera (${espera.length})`]];
      return `<div class="pestanas">${t.map(([k, n]) => `<button class="${k === vista ? 'activa' : ''}" data-accion="vista" data-vista="${k}">${n}</button>`).join('')}</div>`;
    }

    function htmlResumen() {
      const n = (e) => correos.filter((c) => c.estado === e && (e !== 'respondido' || true)).length;
      const kpi = (num, txt, color) => `<div class="kpi" style="border-color:${color || '#0f766e'}"><b>${num}</b><span>${txt}</span></div>`;
      const pend = espera.filter((e) => e.estado === 'pendiente').length;
      const pct = Math.min(100, Math.round(espera.length / 20 * 100));
      const ultimos = espera.slice(0, 5).map((e) => `<div class="tarjeta"><b>${escapar(e.email)}</b><br><small>${e.nombre ? escapar(e.nombre) + ' · ' : ''}${fecha(e.fecha + 'T12:00:00')}${e.origen ? ' · ' + escapar(e.origen) : ''}</small></div>`).join('');
      const resp = correos.filter((c) => c.estado === 'respondido').slice(0, 3).map(tarjetaCorreo).join('');
      const urgentes = correos.filter((c) => c.estado === 'pendiente_ti').map(tarjetaCorreo).join('');
      return `${urgentes ? `<h3>⚠ Necesitan tu respuesta (${n('pendiente_ti')})</h3>${urgentes}` : ''}<div class="kpis">${kpi(n('pendiente_ti'), 'necesitan tu respuesta', '#e53935')}${kpi(espera.length, 'personas en la lista de espera', '#7c3aed')}${kpi(pend, 'por invitar', '#e8a317')}${kpi(contactos.length, 'contactos de ventas')}${kpi(correos.filter((c) => c.direccion === 'entrada').length, 'correos recibidos', '#6b7280')}${kpi(n('borrador'), 'correos en borrador', '#e8a317')}${kpi(n('enviado'), 'correos enviados', '#2563eb')}${kpi(n('respondido'), 'respuestas', '#15803d')}</div>
        <div class="tarjeta"><b>Las 20 primeras familias, gratis</b><br><small>${Math.min(espera.length, 20)} de 20 plazas con alguien apuntado en la web</small>
          <div class="barra" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>
        <h3>📬 Últimos que se han apuntado</h3>${ultimos || '<p class="vacio">Nadie todavía.</p>'}
        <h3>💬 Últimas respuestas</h3>${resp || '<p class="vacio">Aún no hay respuestas.</p>'}`;
    }

    function tarjetaCorreo(c) {
      const entrada = c.direccion === 'entrada';
      const acc = c.estado === 'borrador'
        ? `<button class="principal" data-accion="correo_enviado" data-id="${c.id}">Marcar como enviado</button>`
        : c.estado === 'enviado' ? `<button class="principal" data-accion="correo_respuesta" data-id="${c.id}">Apuntar respuesta</button>`
        : c.estado === 'pendiente_ti' ? `<a class="principal" style="text-decoration:none;display:inline-block" href="mailto:${escapar(c.remitente_email || c.para_email || '')}?subject=${encodeURIComponent('Re: ' + (c.asunto || ''))}">Contestar yo</a><button class="secundario" data-accion="correo_resuelto" data-id="${c.id}">Ya está contestado</button>` : '';
      const quien = entrada ? `De: ${escapar(c.para_nombre || c.remitente_email || '—')}${c.remitente_email ? ' · ' + escapar(c.remitente_email) : ''}` : `Para: ${escapar(c.para_nombre || c.para_email || '—')}${c.para_email && c.para_nombre ? ' · ' + escapar(c.para_email) : ''}`;
      return `<article class="tarjeta" ${c.estado === 'pendiente_ti' ? 'style="border-color:#ef4444;border-width:2px"' : ''}><h3>${entrada ? '↩ ' : ''}${escapar(c.asunto)}</h3>
        <span class="estado ${c.estado}">${EST_CORREO[c.estado] || c.estado}</span><small>${quien}${c.enviado_en ? ' · enviado ' + fecha(c.enviado_en) : ''}${c.respuesta_en ? ' · respuesta ' + fecha(c.respuesta_en) : ''}${entrada ? ' · recibido ' + fecha(c.creado_en) : ''}</small>
        ${entrada && c.cuerpo ? `<pre>✉️ ${escapar(c.cuerpo)}</pre>` : ''}
        ${c.respuesta ? `<pre>${entrada ? '🤖 Contestó Pepo: ' : '💬 '}${escapar(c.respuesta)}</pre>` : ''}
        ${!entrada && c.cuerpo ? `<details><summary>Ver el correo</summary><pre>${escapar(c.cuerpo)}</pre></details>` : ''}
        <div class="acciones">${acc}<button class="secundario" data-accion="correo_borrar" data-id="${c.id}">Quitar</button></div></article>`;
    }

    function htmlCorreos() {
      const lista = correos.filter((c) => filtro === 'todos' || (filtro === 'entrada' ? c.direccion === 'entrada' : c.estado === filtro));
      const chips = ['todos', 'pendiente_ti', 'entrada', 'borrador', 'enviado', 'respondido'].map((f) => `<button class="${f === filtro ? 'activa' : ''}" data-accion="filtro" data-filtro="${f}">${f === 'todos' ? 'Todos' : f === 'entrada' ? '↩ Recibidos' : f === 'pendiente_ti' ? '⚠ Necesitan tu respuesta' : EST_CORREO[f]}</button>`).join('');
      return `<div class="chips">${chips}</div>
        <details><summary>➕ Apuntar un correo</summary><form class="nuevo" id="f-correo">
          <input id="c-nombre" placeholder="Para (organización o persona)"><input id="c-email" type="email" placeholder="Correo del destinatario">
          <input id="c-asunto" placeholder="Asunto"><textarea id="c-cuerpo" rows="4" placeholder="Texto del correo"></textarea>
          <select id="c-estado"><option value="borrador">Borrador</option><option value="enviado">Ya enviado</option></select>
          <div class="acciones"><button type="button" class="principal" data-accion="correo_add">Guardar</button></div></form></details>
        ${lista.map(tarjetaCorreo).join('') || '<p class="vacio">No hay correos en esta lista.</p>'}`;
    }

    function htmlContactos() {
      const opN = Object.entries(NICHOS).map(([k, v]) => `<option value="${k}">${v}</option>`).join('');
      const filas = contactos.map((c) => `<article class="tarjeta"><h3>${escapar(c.nombre)}</h3>
        <span class="estado ${c.estado}">${EST_CONTACTO[c.estado] || c.estado}</span><small>${NICHOS[c.nicho] || c.nicho}${c.email ? ' · ' + escapar(c.email) : ''}</small>
        ${c.web ? `<br><small><a href="${escapar(c.web)}" target="_blank" rel="noopener">${escapar(c.web)}</a></small>` : ''}${c.fuente ? `<br><small>Fuente: ${escapar(c.fuente)}</small>` : ''}${c.notas ? `<br><small>📝 ${escapar(c.notas)}</small>` : ''}
        <div class="acciones"><select data-accion="contacto_estado" data-id="${c.id}">${Object.entries(EST_CONTACTO).map(([k, v]) => `<option value="${k}" ${k === c.estado ? 'selected' : ''}>${v}</option>`).join('')}</select>
          <button class="secundario" data-accion="contacto_borrar" data-id="${c.id}">Quitar</button></div></article>`).join('');
      return `<details><summary>➕ Apuntar un contacto</summary><form class="nuevo">
          <input id="k-nombre" placeholder="Nombre de la organización"><select id="k-nicho">${opN}</select>
          <input id="k-email" type="email" placeholder="Correo público de contacto"><input id="k-web" placeholder="Web (https://…)">
          <input id="k-fuente" placeholder="Fuente: dónde se ha encontrado el contacto"><textarea id="k-notas" rows="2" placeholder="Notas"></textarea>
          <div class="acciones"><button type="button" class="principal" data-accion="contacto_add">Guardar contacto</button></div></form></details>
        ${filas || '<p class="vacio">Todavía no hay contactos. Pepo los irá apuntando aquí.</p>'}`;
    }

    function htmlEspera() {
      const filas = espera.map((e) => `<article class="tarjeta"><b><a href="mailto:${escapar(e.email)}">${escapar(e.email)}</a></b> <span class="estado ${e.estado}">${e.estado === 'pendiente' ? 'Por invitar' : e.estado === 'invitado' ? 'Invitado' : 'Descartado'}</span><br>
        <small>${e.nombre ? escapar(e.nombre) + ' · ' : ''}se apuntó el ${fecha(e.fecha + 'T12:00:00')}${e.origen ? ' · ' + escapar(e.origen) : ''}${e.codigo ? ' · código ' + escapar(e.codigo) : ''}</small>${e.mensaje ? `<br><small>💬 ${escapar(e.mensaje)}</small>` : ''}</article>`).join('');
      return `<p class="suave">Gente que ha dejado su correo en pepafamilyapp.es. Para invitarlos y darles su código usa la pestaña «Familias» de Producción.</p>${filas || '<p class="vacio">Nadie en la lista de espera todavía.</p>'}`;
    }

    function pintar() {
      const cuerpo = vista === 'correos' ? htmlCorreos() : vista === 'contactos' ? htmlContactos() : vista === 'espera' ? htmlEspera() : htmlResumen();
      const abiertos = [...document.querySelectorAll('#contenido details[open] summary')].map((s) => s.textContent);
      $('contenido').innerHTML = pestanas() + cuerpo;
      document.querySelectorAll('#contenido details').forEach((d) => { if (abiertos.includes(d.querySelector('summary').textContent)) d.open = true; });
    }

    async function guardar(promesa, ok) {
      const { error } = await promesa;
      if (error) { avisar('No se pudo guardar: ' + error.message); return false; }
      avisar(''); if (ok) ok(); return true;
    }

    document.addEventListener('click', async (ev) => {
      const b = ev.target.closest('[data-accion]'); if (!b || b.tagName === 'SELECT') return;
      const a = b.dataset.accion, id = b.dataset.id, v = (x) => ($(x).value || '').trim();
      if (a === 'vista') { vista = b.dataset.vista; pintar(); return; }
      if (a === 'filtro') { filtro = b.dataset.filtro; pintar(); return; }
      if (a === 'correo_add') {
        if (!v('c-asunto')) { avisar('Escribe el asunto.'); return; }
        const fila = { para_nombre: v('c-nombre') || null, para_email: v('c-email') || null, asunto: v('c-asunto'), cuerpo: v('c-cuerpo') || null, estado: v('c-estado'), enviado_en: v('c-estado') === 'enviado' ? new Date().toISOString() : null };
        if (await guardar(sb.from('ventas_correos').insert(fila))) cargar(); return;
      }
      if (a === 'correo_enviado') { if (await guardar(sb.from('ventas_correos').update({ estado: 'enviado', enviado_en: new Date().toISOString() }).eq('id', id))) cargar(); return; }
      if (a === 'correo_respuesta') {
        const t = prompt('Pega o resume la respuesta que ha llegado:'); if (!t) return;
        const c = correos.find((x) => x.id === id);
        if (await guardar(sb.from('ventas_correos').update({ estado: 'respondido', respuesta: t.trim(), respuesta_en: new Date().toISOString() }).eq('id', id))) {
          if (c && c.contacto_id) await sb.from('ventas_contactos').update({ estado: 'respondio' }).eq('id', c.contacto_id);
          cargar();
        } return;
      }
      if (a === 'correo_resuelto') { if (await guardar(sb.from('ventas_correos').update({ estado: 'respondido', respuesta_en: new Date().toISOString() }).eq('id', id))) cargar(); return; }
      if (a === 'correo_borrar') { if (!confirm('¿Quitar este correo de la lista?')) return; if (await guardar(sb.from('ventas_correos').delete().eq('id', id))) cargar(); return; }
      if (a === 'contacto_add') {
        if (!v('k-nombre')) { avisar('Escribe el nombre de la organización.'); return; }
        const fila = { nombre: v('k-nombre'), nicho: v('k-nicho'), email: v('k-email') || null, web: v('k-web') || null, fuente: v('k-fuente') || null, notas: v('k-notas') || null };
        if (await guardar(sb.from('ventas_contactos').insert(fila))) cargar(); return;
      }
      if (a === 'contacto_borrar') { if (!confirm('¿Quitar este contacto?')) return; if (await guardar(sb.from('ventas_contactos').delete().eq('id', id))) cargar(); return; }
    });
    document.addEventListener('change', async (ev) => {
      const s = ev.target.closest('select[data-accion="contacto_estado"]'); if (!s) return;
      if (await guardar(sb.from('ventas_contactos').update({ estado: s.value }).eq('id', s.dataset.id))) cargar();
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw-ventas.js').catch(() => {});
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace('index.html'); return; }
      sb.auth.onAuthStateChange((_e, s) => { if (!s) location.replace('index.html'); });
      cargar();
    })();
  </script>
</body>
</html>
