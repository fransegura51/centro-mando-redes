<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <radialGradient id="ig" cx="30%" cy="115%" r="150%">
      <stop offset="0" stop-color="#FED576"/>
      <stop offset="0.25" stop-color="#F47133"/>
      <stop offset="0.55" stop-color="#BC3081"/>
      <stop offset="1" stop-color="#4F5BD5"/>
    </radialGradient>
    <filter id="sombra" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- YouTube -->
  <g filter="url(#sombra)">
    <circle cx="164" cy="164" r="80" fill="#FF0000"/>
    <path d="M144 130 L144 198 L204 164 Z" fill="#ffffff"/>
  </g>

  <!-- Instagram -->
  <g filter="url(#sombra)">
    <circle cx="348" cy="164" r="80" fill="url(#ig)"/>
    <rect x="313" y="129" width="70" height="70" rx="20" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="348" cy="164" r="18" fill="none" stroke="#ffffff" stroke-width="8"/>
    <circle cx="370" cy="142" r="5" fill="#ffffff"/>
  </g>

  <!-- Facebook -->
  <g filter="url(#sombra)">
    <circle cx="164" cy="348" r="80" fill="#1877F2"/>
    <text x="164" y="348" dominant-baseline="central" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="104" fill="#ffffff">f</text>
  </g>

  <!-- TikTok -->
  <g filter="url(#sombra)">
    <circle cx="348" cy="348" r="80" fill="#010101"/>
    <text x="345" y="345" dominant-baseline="central" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="#25F4EE">&#9834;</text>
    <text x="351" y="351" dominant-baseline="central" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="#FE2C55">&#9834;</text>
    <text x="348" y="348" dominant-baseline="central" text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="72" fill="#ffffff">&#9834;</text>
  </g>
</svg>
