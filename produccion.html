<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Producción — Centro de Mando Redes</title>
  <style>
    :root {
      --fondo: #f3f4f6; --tarjeta: #ffffff; --texto: #111827; --suave: #6b7280;
      --borde: #e5e7eb; --primario: #2563eb; --error: #b91c1c; --error-fondo: #fee2e2;
      --ok: #15803d; --aviso: #b45309;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fondo); color: var(--texto); font-size: 16px; }
    header { background: #111827; color: #fff; padding: 14px 16px; display: flex;
      justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.1rem; font-weight: 600; }
    header a { color: #fff; font-size: 0.85rem; text-decoration: none; border: 1px solid #4b5563;
      border-radius: 6px; padding: 6px 10px; }
    main { padding: 16px; max-width: 900px; margin: 0 auto; }
    [hidden] { display: none !important; }
    .titulo-seccion { display: flex; justify-content: space-between; align-items: baseline;
      margin: 20px 0 10px; }
    .titulo-seccion h2 { margin: 0; font-size: 1.05rem; }
    .titulo-seccion small { color: var(--suave); }
    .lista { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 10px;
      padding: 14px 16px; }
    .tarjeta h3 { margin: 0 0 4px; font-size: 1rem; }
    .tarjeta h3 .codigo { color: var(--suave); font-weight: 400; margin-right: 6px; }
    .personajes { font-size: 0.8rem; color: var(--suave); margin-bottom: 8px; }
    .guion { white-space: pre-wrap; font-size: 0.95rem; line-height: 1.4; margin: 8px 0; }
    details { margin: 8px 0; font-size: 0.9rem; }
    summary { cursor: pointer; color: var(--suave); }
    details pre { white-space: pre-wrap; margin: 6px 0 0; font: inherit; line-height: 1.4;
      background: var(--fondo); padding: 10px; border-radius: 6px; }
    .acciones { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button { font-size: 1rem; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--borde);
      background: #fff; color: var(--texto); cursor: pointer; }
    button.principal { background: var(--primario); border-color: var(--primario); color: #fff;
      flex: 1 1 100%; }
    button.secundario { flex: 1; font-size: 0.9rem; }
    button:disabled { opacity: 0.6; }
    label { display: block; font-size: 0.8rem; color: var(--suave); margin: 10px 0 4px; }
    input, textarea { width: 100%; padding: 10px; font: inherit; border: 1px solid var(--borde);
      border-radius: 6px; }
    textarea { min-height: 110px; }
    .etiqueta-estado { font-size: 0.8rem; color: var(--suave); margin-top: 8px; }
    .motivo { font-size: 0.85rem; color: var(--error); margin-top: 6px; }
    .aviso-global { padding: 10px 12px; border-radius: 6px; background: #fef3c7;
      color: var(--aviso); font-size: 0.9rem; margin-bottom: 12px; }
    .vacio { color: var(--suave); font-style: italic; }
    #cargando { text-align: center; color: var(--suave); }
    .pestanas { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; position: sticky; top: 0;
      background: var(--fondo); padding: 6px 0; z-index: 5; }
    .pestanas button { flex: 1 0 auto; font-size: 0.9rem; padding: 10px 12px; white-space: nowrap; }
    .pestanas button.activa { background: var(--primario); border-color: var(--primario); color: #fff; }
    label.check { display: flex; align-items: center; gap: 8px; color: var(--texto);
      font-size: 0.95rem; margin: 6px 0; }
    label.check input { width: auto; }
    video.reproductor { width: 100%; max-height: 70vh; background: #000; border-radius: 8px; margin-top: 8px; }
    .pub { font-size: 0.85rem; margin-top: 4px; }
    .pub .error { color: var(--error); }
    .tabla-dia { overflow-x: auto; background: #fff; border-radius: 10px; }
    .tabla-dia table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .tabla-dia th, .tabla-dia td { padding: 6px 8px; text-align: right; border-bottom: 1px solid #eee; white-space: nowrap; }
    .tabla-dia th:first-child, .tabla-dia td:first-child { text-align: left; }
    .sube { color: #1b873f; } .baja { color: #c62828; }
    .aviso-almacen { border-radius: 12px; padding: 10px 14px; margin-bottom: 10px; font-weight: 600; line-height: 1.4; }
    .aviso-almacen.alto { background: #ffe0e0; border: 2px solid #e53935; color: #7a1010; }
    .enlace-boton { display: inline-block; text-decoration: none; text-align: center; padding: 10px 16px; border-radius: 10px; font-weight: 700; }
    .enlace-boton.principal { background: #2f7d5b; color: #fff; }
    .enlace-boton.secundario { background: #fff; color: #1f1b2e; border: 2px solid #d9d4e6; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); gap: 8px; margin: 10px 0; }
    .kpi { background: #fff; border-left: 5px solid; border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; }
    .kpi b { font-size: 1.4rem; } .kpi span { font-size: 0.78rem; color: #666; }
    .fila-fam, .fila-mod { background: #fff; border-radius: 10px; padding: 10px 12px; margin: 8px 0; display: flex; flex-direction: column; gap: 6px; }
    .fam-datos, .mod-texto { display: flex; flex-direction: column; gap: 2px; }
    .fam-datos small, .mod-texto small { color: #666; line-height: 1.35; }
    .mod-cols { display: flex; gap: 8px; flex-wrap: wrap; }
    .form-fam { display: flex; flex-direction: column; gap: 6px; padding: 8px 4px; }
    .form-fam input { padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; }
    .resumen-redes { margin-bottom: 12px; }
    .total-redes { background: #1f1b2e; color: #fff; border-radius: 14px; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; }
    .total-redes b { font-size: 1.9rem; }
    .mini-redes { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
    .mini-redes span { border: 2px solid; border-radius: 999px; padding: 4px 12px; font-weight: 700; background: #fff; }
    .titulo-bloque { margin: 16px 0 8px; font-size: 1.05rem; }
    .rank { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
    .fila-rank { display: flex; gap: 8px; align-items: flex-start; background: #fff; border-radius: 10px; padding: 8px 10px; }
    .rank-n { font-weight: 700; min-width: 22px; color: #777; }
    .rank-t { flex: 1; font-size: 0.92rem; }
    .rank-barra { display: block; height: 6px; background: #eee; border-radius: 4px; margin-top: 4px; overflow: hidden; }
    .rank-barra i { display: block; height: 100%; border-radius: 4px; }
    .rank-v { font-weight: 700; white-space: nowrap; }
    .conclusiones p { background: #fff; border-radius: 10px; padding: 8px 12px; margin: 8px 0; font-size: 0.93rem; line-height: 1.45; }
    .leyenda { font-size: 0.9rem; margin-bottom: 12px; line-height: 1.8; }
    details.carpeta { margin: 14px 0; border-radius: 14px; padding: 4px 12px 12px; border: 3px solid; }
    details.carpeta > summary { display: flex; align-items: center; gap: 10px; list-style: none; cursor: pointer;
      padding: 12px 0; color: var(--texto); font-weight: 700; font-size: 1.2rem; }
    details.carpeta > summary::-webkit-details-marker { display: none; }
    .carpeta-icono { font-size: 1.6rem; }
    .carpeta-nombre { flex: 1; }
    .carpeta-num { background: #fff; border-radius: 999px; padding: 2px 14px; font-size: 1.1rem; }
    .carpeta-ayuda { font-size: 0.85rem; color: var(--suave); margin: 0 0 10px; }
    details.carpeta.amarillo { background: #fef9c3; border-color: #eab308; }
    details.carpeta.verde { background: #dcfce7; border-color: #22c55e; }
    details.carpeta.medias { background: #ffedd5; border-color: #f97316; }
    details.carpeta.rojo { background: #fee2e2; border-color: #ef4444; }
    details.carpeta.gris { background: #f3f4f6; border-color: #9ca3af; }
    .tarjeta.video { border-left-width: 8px; }
    .tarjeta.video h3 { font-size: 1.15rem; }
    .tarjeta.video.amarillo { border-left-color: #eab308; }
    .tarjeta.video.verde { border-left-color: #22c55e; }
    .tarjeta.video.rojo { border-left-color: #ef4444; }
    .tarjeta.video.gris { border-left-color: #9ca3af; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .chip { font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; background: #e5e7eb; }
    button.chip { border: 0; font-size: 0.95rem; padding: 9px 14px; cursor: pointer; color: var(--texto); }
    .ayuda-chips { font-size: 0.8rem; color: var(--suave); margin: 0 0 8px; }
    .chip.verde { background: #bbf7d0; color: #14532d; }
    .chip.amarillo { background: #fde68a; color: #713f12; }
    .chip.rojo { background: #fecaca; color: #7f1d1d; }
    .estado-video { font-size: 0.9rem; color: var(--suave); }
    .aviso-manual { font-size: 0.95rem; font-weight: 600; background: #fde68a; color: #713f12;
      border-radius: 8px; padding: 8px 10px; }
    .fila { background: #fff; border: 1px solid var(--borde); border-left: 8px solid #9ca3af; border-radius: 10px;
      padding: 10px 12px; margin: 8px 0; }
    .fila.amarillo { border-left-color: #eab308; }
    .fila.verde { border-left-color: #22c55e; }
    .fila.rojo { border-left-color: #ef4444; }
    details.subida { background: #fff; border: 1px dashed var(--borde); border-radius: 10px; padding: 8px 12px; }
  </style>
</head>
<body>
  <header>
    <h1>Producción</h1>
    <a href="conectar.html">Ajustes</a>
  </header>
  <main>
    <div id="aviso-global" class="aviso-global" hidden></div>
    <p id="cargando">Cargando…</p>
    <div id="contenido" hidden></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script>
    const CONFIG = window.CMR_CONFIG || {};
    const $ = (id) => document.getElementById(id);
    const sb = supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false },
    });

    // Grupos de estados, en el orden en que se muestran.
    const GRUPOS = [
      { titulo: 'Por aprobar', estados: ['borrador'] },
      { titulo: 'Listos para Flow', estados: ['aprobado_guion'] },
      { titulo: 'Revisar vídeo', estados: ['pendiente_revision'] },
      { titulo: 'En marcha', estados: ['video_subido', 'aprobado_publicar'] },
      { titulo: 'Publicados', estados: ['publicado'] },
      { titulo: 'Rechazados', estados: ['rechazado'] },
    ];
    const NOMBRE_ESTADO = {
      borrador: 'Borrador', aprobado_guion: 'Guion aprobado', video_subido: 'Vídeo subido',
      pendiente_revision: 'Pendiente de revisión', aprobado_publicar: 'Aprobado para publicar',
      publicado: 'Publicado', rechazado: 'Rechazado',
    };

    const MAX_PETICION = 14;
    const BUCKET_VIDEOS = 'videos-editados';
    // Redes que se publican a mano (el panel deja el paquete listo). Para automatizar una
    // red más adelante, quítala de MANUALES y la función `publicar` la hará sola.
    const MANUALES = ['instagram', 'facebook', 'tiktok', 'whatsapp', 'telegram'];
    // WhatsApp y Telegram son opcionales (no cuentan para «publicado en todas»): se marcan a mano, ~1 cada 2 días.
    const PLATAFORMAS = [['youtube', 'YouTube (automático)'], ['instagram', 'Instagram (lo sube el agente de Claude)'], ['facebook', 'Facebook (lo subes tú desde el móvil, te dejo todo listo)'], ['tiktok', 'TikTok (lo subes tú, te dejo todo listo)'], ['whatsapp', 'WhatsApp (canal Pepa Family; lo sube el agente, con etiqueta de IA)'], ['telegram', 'Telegram (canal Pepa family; uno cada dos días aprox.)']];
    const OPCIONALES = ['whatsapp', 'telegram'];
    const NOMBRE_PLAT = { youtube: 'YouTube', instagram: 'Instagram', facebook: 'Facebook', tiktok: 'TikTok', whatsapp: 'WhatsApp', telegram: 'Telegram' };
    const NOMBRE_PUB = { pendiente: 'programado', publicando: 'publicando…', publicado: 'publicado', error: 'con error', manual: 'a la espera de que lo suba el agente (o tú a mano)' };
    let publicaciones = [];
    let videosLib = []; // vídeos de la biblioteca (bucket privado)
    let guiones = [];
    let statsRes = []; // estadísticas por red (resumen)
    let statsVid = []; // estadísticas por vídeo
    let ideasViral = []; // ideas y tendencias del investigador
    let statsDia = []; // total de visualizaciones por día y red
    let analisisApp = []; // análisis de la app frente a la competencia
    let familias = []; // familias que tienen la app
    let planesF = []; // qué módulos son gratis o de pago
    let appResumen = []; // cifras sueltas de la app
    let listaEspera = []; // personas que dejaron su correo en la web
    let pendientes = 0; // peticiones de guiones sin atender
    let editando = null; // id del guion en edición

    function escapar(t) {
      return String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function avisar(texto) {
      const a = $('aviso-global');
      a.textContent = texto || '';
      a.hidden = !texto;
    }

    function htmlEdicion(g) {
      return `<article class="tarjeta" data-id="${g.id}">
        <h3><span class="codigo">${escapar(g.codigo)}</span>Editar guion</h3>
        <label>Título</label><input data-campo="titulo" value="${escapar(g.titulo)}">
        <label>Guion</label><textarea data-campo="guion">${escapar(g.guion)}</textarea>
        <label>Prompt para Flow</label><textarea data-campo="prompt_flow">${escapar(g.prompt_flow)}</textarea>
        <label>Texto de publicación</label><textarea data-campo="texto_publicacion">${escapar(g.texto_publicacion)}</textarea>
        <label>Hashtags</label><input data-campo="hashtags" value="${escapar(g.hashtags)}">
        <div class="acciones">
          <button class="principal" data-accion="guardar">Guardar cambios</button>
          <button class="secundario" data-accion="cancelar">Cancelar</button>
        </div>
      </article>`;
    }

    function fechaEs(iso) {
      return new Date(iso).toLocaleString('es-ES', { timeZone: 'Europe/Madrid', dateStyle: 'short', timeStyle: 'short' });
    }

    function htmlRevision(g) {
      const redes = PLATAFORMAS.map(([k, n]) =>
        `<label class="check"><input type="checkbox" data-plataforma="${k}"${OPCIONALES.includes(k) ? '' : ' checked'}> ${n}</label>`).join('');
      return `<div class="acciones"><button class="secundario" data-accion="ocultar_video">▲ Esconder vídeo</button></div>
        <video class="reproductor" data-ruta="${escapar(g.codigo)}.mp4" controls playsinline preload="metadata"></video>
        <label>Fecha y hora de publicación (la eliges tú; no se publica nada sin ella)</label>
        <input type="datetime-local" data-campo="fecha">
        <label>Dónde</label>${redes}`;
    }

    function htmlSeguimiento(g) {
      const mias = publicaciones.filter((p) => p.guion_id === g.id).sort((a, b) => new Date(a.programado_para) - new Date(b.programado_para));
      const tieneVideo = !!g.video_archivado || videosLib.some((v) => v.name === g.codigo + '.mp4');
      if (!mias.length && !tieneVideo) return '';
      const lineas = mias.map((p) => {
        const abierta = ['pendiente', 'manual', 'error'].includes(p.estado);
        const estado = NOMBRE_PUB[p.estado] || escapar(p.estado);
        const cuando = abierta ? '' : (p.publicado_en ? ` · ${fechaEs(p.publicado_en)}` : '');
        const enlace = p.url_publicada ? ` · <a href="${escapar(p.url_publicada)}" target="_blank" rel="noopener">ver</a>` : '';
        const err = p.estado === 'error' && p.error_texto ? `<div class="error">${escapar(p.error_texto)}</div>` : '';
        const red = NOMBRE_PLAT[p.plataforma] || p.plataforma;
        const botones = [];
        if (abierta) {
          botones.push(`<button class="secundario" data-accion="cambiar_hora" data-pub="${p.id}">Guardar fecha y hora</button>`);
          if (p.estado === 'error') botones.push(`<button class="secundario" data-accion="reintentar" data-pub="${p.id}">Reintentar</button>`);
          if (['manual', 'pendiente'].includes(p.estado) && MANUALES.includes(p.plataforma)) {
            botones.push(`<button class="secundario" data-accion="manual_descargar">Descargar vídeo</button>`);
            botones.push(`<button class="secundario" data-accion="manual_copiar">Copiar texto</button>`);
          }
          botones.push(`<button class="principal" data-accion="manual_hecho" data-pub="${p.id}">Ya publicado en ${escapar(red)}</button>`);
        }
        const fecha = abierta
          ? `<input type="datetime-local" data-hora="${p.id}" value="${aLocalInput(p.programado_para)}">` : '';
        return `<div class="pub"><strong>${escapar(red)}</strong>: ${estado}${cuando}${enlace}${err}${fecha}
          ${botones.length ? `<div class="acciones">${botones.join('')}</div>` : ''}</div>`;
      });
      // Programar otra red para este mismo vídeo.
      const usadas = mias.map((p) => p.plataforma);
      const libres = PLATAFORMAS.filter(([k]) => !usadas.includes(k));
      const nueva = libres.length ? `<div class="pub"><strong>Programar otra red</strong>
          <select data-nueva-red>${libres.map(([k, n]) => `<option value="${k}">${escapar(n)}</option>`).join('')}</select>
          <input type="datetime-local" data-nueva-hora>
          <div class="acciones"><button class="secundario" data-accion="programar_red">Programar</button></div></div>` : '';
      return `<div class="guion" style="margin-top:10px"><strong>Calendario de este vídeo</strong>${lineas.join('')}${nueva}</div>`;
    }

    function htmlTarjeta(g) {
      if (editando === g.id) return htmlEdicion(g);
      let acciones = '';
      let extra = '';
      if (g.estado === 'pendiente_revision') {
        extra = htmlRevision(g);
        acciones = `<button class="principal" data-accion="aprobar_video">Aprobar y programar (elige antes la fecha)</button>
          <button class="secundario" data-accion="rechazar">Rechazar</button>`;
      } else if (!['borrador', 'rechazado', 'aprobado_guion'].includes(g.estado) || publicaciones.some((p) => p.guion_id === g.id)) {
        extra = htmlSeguimiento(g);
      }
      if (g.estado === 'borrador') {
        acciones = `<button class="principal" data-accion="aprobar">Aprobar guion</button>
          <button class="secundario" data-accion="editar">Editar</button>
          <button class="secundario" data-accion="rechazar">Rechazar</button>`;
      } else if (g.estado === 'aprobado_guion') {
        acciones = `<button class="principal" data-accion="copiar">Copiar prompt</button>
          <button class="secundario" data-accion="editar">Editar</button>`;
      } else if (g.estado === 'rechazado') {
        acciones = `<button class="secundario" data-accion="reabrir">Volver a borrador</button>`;
      }
      acciones += `<button class="secundario" data-accion="eliminar">Eliminar</button>`;
      const nota = g.fotogramas_notas
        ? `<details><summary>Fotogramas de referencia</summary><pre>${escapar(g.fotogramas_notas)}</pre></details>` : '';
      const motivo = g.estado === 'rechazado' && g.motivo_rechazo
        ? `<div class="motivo">Motivo: ${escapar(g.motivo_rechazo)}</div>` : '';
      const conRedes = ['pendiente_revision', 'video_subido', 'aprobado_publicar', 'publicado'].includes(g.estado)
        || publicaciones.some((p) => p.guion_id === g.id);
      const ev = estadoVideo(g);
      const color = g.estado === 'rechazado' ? 'gris' : ev.color;
      const redes = conRedes
        ? `<div class="chips">${ev.redes.map(([r, c]) =>
          `<button class="chip ${c}" data-accion="marcar_red" data-red="${r}">${c === 'verde' ? '✔' : c === 'amarillo' ? '⏳' : c === 'rojo' ? '✖' : '○'} ${escapar(NOMBRE_PLAT[r] || r)}</button>`).join('')}</div>
          <div class="ayuda-chips">Toca una red para marcarla como publicada ✔ (o para quitarla).</div>`
          + (ev.aviso ? `<div class="aviso-manual">⚠ ${escapar(ev.aviso)}</div>` : '')
        : '';
      return `<article class="tarjeta video ${color}" data-id="${g.id}">
        <h3><span class="codigo">${escapar(g.codigo)}</span>${escapar(g.titulo)}</h3>
        ${redes}
        <div class="personajes">${escapar((g.personajes || []).join(', '))}</div>
        <div class="guion">${escapar(g.guion)}</div>
        <details><summary>Prompt para Flow</summary><pre>${escapar(g.prompt_flow)}</pre></details>
        ${nota}
        <details><summary>Texto de publicación</summary><pre>${escapar(g.texto_publicacion)}\n\n${escapar(g.hashtags)}</pre></details>
        ${extra}
        <div class="etiqueta-estado">${NOMBRE_ESTADO[g.estado] || escapar(g.estado)}</div>
        ${motivo}
        ${acciones ? `<div class="acciones">${acciones}</div>` : ''}
      </article>`;
    }

    function htmlPeticion() {
      const estado = pendientes
        ? `<div class="etiqueta-estado">Hay ${pendientes} petición(es) pendiente(s). Dile a Claude: «genera los guiones pendientes».</div>` : '';
      return `<div class="tarjeta">
        <h3>Generar guiones</h3>
        <label for="num-guiones">¿Cuántos guiones quieres? (1 a ${MAX_PETICION})</label>

    // ---- Vídeos: una tarjeta por vídeo, con su color y las cuatro redes a la vista ----
    const ORDEN_REDES = ['youtube', 'instagram', 'facebook', 'tiktok'];
    const LAS_SUBES_TU = ['facebook', 'tiktok'];

    function nombresRedes(lista) {
      const n = lista.map((r) => NOMBRE_PLAT[r] || r);
      return n.length > 1 ? n.slice(0, -1).join(', ') + ' y ' + n[n.length - 1] : n.join('');
    }

    function estadoVideo(g) {
      const mias = publicaciones.filter((p) => p.guion_id === g.id);
      const redes = ORDEN_REDES.map((r) => {
        const p = mias.filter((x) => x.plataforma === r);
        let e = 'gris';
        if (p.some((x) => x.estado === 'publicado')) e = 'verde';
        else if (p.some((x) => x.estado === 'error')) e = 'rojo';
        else if (p.length) e = 'amarillo';
        return [r, e];
      });
      const faltan = redes.filter(([, e]) => e !== 'verde').map(([r]) => r);
      const faltanAuto = faltan.filter((r) => !LAS_SUBES_TU.includes(r));
      const faltanTu = faltan.filter((r) => LAS_SUBES_TU.includes(r));
      let color = 'amarillo';
      let texto;
      if (!faltan.length) { color = 'verde'; texto = 'Publicado en las 4 redes'; }
      else if (redes.some(([, e]) => e === 'rojo')) { color = 'rojo'; texto = 'Hay un error al publicar: míralo abajo'; }
      else if (!mias.length) texto = 'Listo para publicar. Elige la fecha en "Fechas y botones"';
      else if (faltanAuto.length) texto = `Pendiente en ${nombresRedes(faltanAuto)} (lo hace Bartolo)`;
      else texto = 'Publicado en YouTube e Instagram';
      const aviso = faltan.length && faltanTu.length ? `Te falta publicar tú a mano en: ${nombresRedes(faltanTu)}` : '';
      return { color, texto, aviso, redes };
    }

    function htmlBiblioteca() {
      const ordenados = [...videosLib].sort((a, b) => b.name.localeCompare(a.name)); // el más nuevo primero
      const carpetas = {
        rojo: { icono: '🔴', nombre: 'Con error', ayuda: 'Algo falló al publicar', items: [] },
        amarillo: { icono: '🟡', nombre: 'Listos / por publicar', ayuda: 'Preparados o a medias: faltan redes', items: [] },
        verde: { icono: '🟢', nombre: 'Publicados en las 4 redes', ayuda: 'Terminados', items: [] },
        gris: { icono: '⚪', nombre: 'Sin guion', ayuda: 'Vídeos sin guion asociado', items: [] }
      };
      ordenados.forEach((v) => {
        const cod = v.name.replace(/\.mp4$/i, '');
        const g = guiones.find((x) => x.codigo === cod);
        const botones = `<div class="pub"><div class="acciones">
            <button class="secundario" data-accion="ver_video" data-ruta="${escapar(v.name)}">▶ Ver</button>
            <button class="secundario" data-accion="descargar_video" data-ruta="${escapar(v.name)}">Descargar</button>
            <button class="secundario" data-accion="borrar_video" data-ruta="${escapar(v.name)}">Eliminar</button>
          </div><div class="visor"></div></div>`;
        if (!g) {
          carpetas.gris.items.push(`<article class="tarjeta video gris"><h3><span class="codigo">${escapar(cod)}</span>Sin guion asociado</h3>${botones}</article>`);
          return;
        }
        const e = estadoVideo(g);
        const botonesVid = e.color === 'verde' ? botones.replace('</div><div class="visor"></div>',
          `<button class="secundario" data-accion="archivar_video" data-ruta="${escapar(v.name)}" title="Borra el archivo de Supabase para ganar espacio; la ficha se queda en el panel">🗄️ Quitar de Supabase</button></div><div class="visor"></div>`) : botones;
        const chips = e.redes.map(([r, c]) =>
          `<button class="chip ${c}" data-accion="marcar_red" data-red="${r}">${c === 'verde' ? '✔' : c === 'amarillo' ? '⏳' : c === 'rojo' ? '✖' : '○'} ${escapar(NOMBRE_PLAT[r] || r)}</button>`).join('');
        carpetas[e.color].items.push(`<article class="tarjeta video ${e.color}" data-id="${g.id}">
          <h3><span class="codigo">${escapar(g.codigo)}</span>${escapar(g.titulo)}</h3>
          <div class="chips">${chips}</div>
          <div class="ayuda-chips">Toca una red para marcarla como publicada ✔ (o para quitarla).</div>
          ${e.aviso ? `<div class="aviso-manual">⚠ ${escapar(e.aviso)}</div>` : `<div class="estado-video">${escapar(e.texto)}</div>`}
          ${botonesVid}
          <details><summary>📅 Fechas y botones de publicación</summary>${htmlSeguimiento(g)}</details>
        </article>`);
      });
      // Vídeos que ya se quitaron de Supabase: la ficha, las redes y el calendario se quedan aquí.
      const archivados = guiones.filter((g) => g.video_archivado && !videosLib.some((v) => v.name === g.codigo + '.mp4'))
        .sort((a, b) => b.codigo.localeCompare(a.codigo));
      const htmlArchivados = archivados.length ? `<details class="carpeta gris">
          <summary><span class="carpeta-icono">🗄️</span><span class="carpeta-nombre">Archivados (solo en tu ordenador)</span>
            <span class="carpeta-num">${archivados.length}</span></summary>
          <div class="carpeta-ayuda">Ya no ocupan espacio en Supabase. Siguen aquí con sus redes y fechas. Si quieres verlos, súbelos otra vez desde «Subir un vídeo nuevo».</div>
          <div class="lista">${archivados.map((g) => {
            const e = estadoVideo(g);
            return `<article class="tarjeta video gris" data-id="${g.id}"><h3><span class="codigo">${escapar(g.codigo)}</span>${escapar(g.titulo)}</h3>
              <div class="chips">${e.redes.map(([r, c]) => `<span class="chip ${c}">${c === 'verde' ? '✔' : '○'} ${escapar(NOMBRE_PLAT[r] || r)}</span>`).join('')}</div>
              <div class="estado-video">🗄️ El vídeo está guardado en tu ordenador (Vídeos cloud)</div></article>`;
          }).join('')}</div></details>` : '';
      const bloques = ['rojo', 'amarillo', 'verde', 'gris'].filter((k) => carpetas[k].items.length).map((k) => {
        const c = carpetas[k];
        return `<details class="carpeta ${k}" ${k === 'verde' || k === 'gris' ? '' : 'open'}>
          <summary><span class="carpeta-icono">${c.icono}</span><span class="carpeta-nombre">${c.nombre}</span>
            <span class="carpeta-num">${c.items.length}</span></summary>
          <div class="carpeta-ayuda">${c.ayuda}</div>
          ${k === 'verde' ? `<div class="acciones"><button class="secundario" data-accion="archivar_todos">🗄️ Quitar de Supabase los ${c.items.length} publicados (se quedan en el panel)</button></div>
            <div class="ayuda-chips">Libera espacio. Descarga antes los que no tengas en tu ordenador: no se puede deshacer.</div>` : ''}
          <div class="lista">${c.items.join('')}</div>
        </details>`;
      }).join('') + htmlArchivados;
      return `<div class="leyenda">🟢 Las 4 redes publicadas &nbsp; 🟡 Pendiente o a medias &nbsp; 🔴 Error</div>
        ${bloques || '<p class="vacio">Todavía no hay vídeos.</p>'}
        <details class="subida"><summary>➕ Subir un vídeo nuevo</summary>
          <label for="archivo-video">Elige uno o varios .mp4. Se numeran solos (G-031, G-032…) en orden de creación; si ya se llaman G-###.mp4, mantienen su número.</label>
          <input id="archivo-video" type="file" accept="video/mp4" multiple>
          <div class="acciones"><button class="principal" data-accion="subir_videos">Subir a la biblioteca</button></div>
        </details>`;
    }

    // Calendario: publicaciones programadas (pendientes o a mano), ordenadas por fecha.
    function aLocalInput(iso) {
      const d = new Date(iso);
      const p = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }

    function htmlCalendario() {
      const carp = {
        rojo: { icono: '🔴', nombre: 'Con error', ayuda: 'Algo falló al publicar: revisa y reintenta', items: [] },
        amarillo: { icono: '🟡', nombre: 'Programadas / por publicar', ayuda: 'Cambia aquí la fecha y hora. Solo se publica lo que tú confirmas', items: [] },
        verde: { icono: '🟢', nombre: 'Ya publicadas', ayuda: 'Terminadas', items: [] },
      };
      const orden = (a, b) => new Date(a.programado_para) - new Date(b.programado_para);
      const fila = (p, color) => {
        const g = guiones.find((x) => x.id === p.guion_id);
        const cuando = color === 'verde' && p.publicado_en ? p.publicado_en : p.programado_para;
        const dia = new Date(cuando).toLocaleString('es-ES',
          { timeZone: 'Europe/Madrid', weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
        const red = NOMBRE_PLAT[p.plataforma] || p.plataforma;
        const quien = p.plataforma === 'youtube' ? 'automático' : (p.plataforma === 'instagram' ? 'lo programa Bartolo' : 'lo subes tú a mano');
        const abierta = color !== 'verde';
        const enlace = p.url_publicada ? ` · <a href="${escapar(p.url_publicada)}" target="_blank" rel="noopener">ver</a>` : '';
        const err = p.estado === 'error' && p.error_texto ? `<div class="error">${escapar(p.error_texto)}</div>` : '';
        const botones = abierta
          ? `<div class="acciones"><button class="secundario" data-accion="cambiar_hora" data-pub="${p.id}">Guardar fecha y hora</button>
              <button class="principal" data-accion="manual_hecho" data-pub="${p.id}">Ya publicado en ${escapar(red)}</button>
              <button class="secundario" data-accion="eliminar_pub" data-pub="${p.id}">Eliminar</button></div>`
          : `<div class="acciones">${MANUALES.includes(p.plataforma) ? `<button class="secundario" data-accion="reabrir_pub" data-pub="${p.id}">Marcar como no publicado</button>` : ''}
              <button class="secundario" data-accion="eliminar_pub" data-pub="${p.id}">Eliminar del calendario</button></div>`;
        return `<div class="fila pub ${color}" data-id="${p.guion_id}">
          <div><strong>${escapar(dia)}</strong> · ${escapar(g ? g.codigo + ' ' + g.titulo : '')}</div>
          <div><span class="chip ${color}">${escapar(red)}</span> <small style="color:var(--suave)">${quien} · ${NOMBRE_PUB[p.estado] || escapar(p.estado)}${enlace}</small></div>
          ${err}
          ${abierta ? `<input type="datetime-local" data-hora="${p.id}" value="${aLocalInput(p.programado_para)}">` : ''}
          ${botones}</div>`;
      };
      publicaciones.filter((p) => p.estado === 'error').sort(orden).forEach((p) => carp.rojo.items.push(fila(p, 'rojo')));
      publicaciones.filter((p) => ['pendiente', 'manual', 'publicando'].includes(p.estado)).sort(orden)
        .forEach((p) => carp.amarillo.items.push(fila(p, 'amarillo')));
      publicaciones.filter((p) => p.estado === 'publicado').sort((a, b) => new Date(b.publicado_en || b.programado_para) - new Date(a.publicado_en || a.programado_para))
        .forEach((p) => carp.verde.items.push(fila(p, 'verde')));
      const bloques = ['rojo', 'amarillo', 'verde'].filter((k) => carp[k].items.length).map((k) =>
        `<details class="carpeta ${k}" ${k === 'verde' ? '' : 'open'}>
          <summary><span class="carpeta-icono">${carp[k].icono}</span><span class="carpeta-nombre">${carp[k].nombre}</span>
            <span class="carpeta-num">${carp[k].items.length}</span></summary>
          <div class="carpeta-ayuda">${carp[k].ayuda}</div>
          ${carp[k].items.join('')}
        </details>`).join('');
      return `<div class="leyenda">🟢 Publicado &nbsp; 🟡 Programado o por publicar &nbsp; 🔴 Error</div>
        <p class="vacio" style="margin:4px 0 8px">YouTube sale solo a la hora que confirmes. Instagram lo programa Bartolo en Meta. Facebook y TikTok los subes tú: te avisa el calendario.</p>
        ${bloques || '<p class="vacio">No hay nada en el calendario. Programa un vídeo desde "Revisar vídeo".</p>'}`;
    }

    const REDES_INFO = {

      instagram: { icono: '📸', nombre: 'Instagram', color: '#c13584' },
      facebook: { icono: '👍', nombre: 'Facebook', color: '#1877f2' },
      tiktok: { icono: '🎵', nombre: 'TikTok', color: '#111' },
      todas: { icono: '🌐', nombre: 'Todas', color: '#6c5ce7' },
    };
    const numES = (n) => (n == null ? '—' : Number(n).toLocaleString('es-ES'));

    function htmlIdeas() {
      if (!ideasViral.length) return '';
      const dia = ideasViral[0].fecha;
      const delDia = ideasViral.filter((i) => i.fecha === dia);
      const tipos = [['tendencia', '🔥', 'Tendencias del día'], ['idea', '💡', 'Ideas de vídeo para hacerse virales'], ['consejo', '🧭', 'Consejos del investigador']];

    function htmlDiario() {
      if (!statsDia.length) return '';
      const dias = [...new Set(statsDia.map((d) => d.fecha))].sort().reverse().slice(0, 14);
      const orden = ['youtube', 'instagram', 'facebook', 'tiktok'];
      const val = (f, k) => { const x = statsDia.find((d) => d.fecha === f && d.plataforma === k); return x ? x.vistas_total : null; };
      const tot = (f) => orden.reduce((a, k) => a + (val(f, k) || 0), 0);
      const filas = dias.map((f, i) => {
        const prev = dias[i + 1];
        const dif = prev ? tot(f) - tot(prev) : null;
        return `<tr><td>${new Date(f + 'T12:00:00').toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' })}</td>
          ${orden.map((k) => `<td>${numES(val(f, k))}</td>`).join('')}
          <td><b>${numES(tot(f))}</b>${dif == null ? '' : `<br><small class="${dif >= 0 ? 'sube' : 'baja'}">${dif >= 0 ? '▲ +' : '▼ '}${numES(dif)}</small>`}</td></tr>`;
      }).join('');
      return `<h3 class="titulo-bloque">📅 Visualizaciones totales cada día</h3>
        <div class="tabla-dia"><table><thead><tr><th>Día</th>${orden.map((k) => `<th>${REDES_INFO[k].icono}</th>`).join('')}<th>Total</th></tr></thead><tbody>${filas}</tbody></table></div>
        <p class="ayuda-chips">Cada día Bartolo apunta aquí el total de cada red. Facebook cuenta los últimos 28 días.</p>`;
    }

    function htmlRedes() {
      if (!statsRes.length) return htmlIdeas() + '<p class="vacio">Aún no hay estadísticas. Dile a Bartolo: «actualiza las estadísticas de las redes».</p>';

      const fecha = statsRes[0].capturado_en ? new Date(statsRes[0].capturado_en).toLocaleDateString('es-ES') : '';
      const orden = ['instagram', 'youtube', 'facebook', 'tiktok'];
      const tarjetas = orden.map((k) => {
        const r = statsRes.find((x) => x.plataforma === k); if (!r) return '';
        const info = REDES_INFO[k];
        const vids = statsVid.filter((v) => v.plataforma === k);
        const media = vids.length ? Math.round(vids.reduce((a, v) => a + v.vistas, 0) / vids.length) : null;
        const maxV = vids.length ? vids[0].vistas : 1;

        const fila = (v, i) => `
          <div class="fila-rank"><span class="rank-n">${i + 1}</span>

            <span class="rank-v">${numES(v.vistas)}</span></div>`;
        return `<details class="carpeta amarillo">
          <summary><span class="carpeta-icono">${info.icono}</span><span class="carpeta-nombre">${info.nombre}</span>
            <span class="carpeta-num">${numES(r.vistas_total)}</span></summary>
          <div class="carpeta-ayuda">${escapar(r.periodo || '')} · ${pct} % del total${r.publicaciones ? ' · ' + r.publicaciones + ' vídeos' : ''}${media ? ' · media ' + numES(media) + ' por vídeo' : ''}${r.seguidores ? ' · ' + numES(r.seguidores) + ' seguidores' : ''}</div>
          ${r.nota ? `<p class="ayuda-chips">${escapar(r.nota)}</p>` : ''}
          <div class="rank">${vids.slice(0, 10).map(fila).join('') || '<p class="vacio">Sin vídeos.</p>'}</div>
          ${vids.length > 10 ? `<details><summary>Ver los ${vids.length} vídeos</summary><div class="rank">${vids.slice(10).map((v, i) => fila(v, i + 10)).join('')}</div></details>` : ''}
        </details>`;
      }).join('');
      return `<div class="resumen-redes"><div class="total-redes"><span>Visualizaciones en total</span><b>${numES(total)}</b></div>
          <div class="mini-redes">${orden.map((k) => { const r = statsRes.find((x) => x.plataforma === k); return r ? `<span style="border-color:${REDES_INFO[k].color}">${REDES_INFO[k].icono} ${numES(r.vistas_total)}</span>` : ''; }).join('')}</div>
          <p class="ayuda-chips">Datos del ${fecha}. Facebook solo cuenta los últimos 28 días. Bartolo los actualiza cada día.</p></div>
        ${htmlDiario()}
        ${htmlIdeas()}
        <h3 class="titulo-bloque">📊 Estadísticas por red</h3>
        ${tarjetas}`;
    }

            ${c.detalle ? `<p>💬 ${escapar(c.detalle)}</p>` : ''}
            <p><small>Fuentes: ${enlaces(c.fuente)}</small></p>
          </div></details>`).join('');
      const bloque = (tipo, icono, titulo, abierto) => {
        const it = ver(tipo); if (!it.length) return '';
        return `<details class="carpeta verde" ${abierto ? 'open' : ''}><summary><span class="carpeta-icono">${icono}</span><span class="carpeta-nombre">${titulo}</span><span class="carpeta-num">${it.length}</span></summary>
          <div class="conclusiones">${it.map((a) => `<p><b>${escapar(a.nombre)}</b><br>${escapar(a.detalle || a.positivos)}${a.negativos && tipo !== 'competidor' ? `<br><small>${escapar(a.negativos)}</small>` : ''}${a.fuente && /^https?:/.test(a.fuente) ? `<br><small>${enlaces(a.fuente)}</small>` : ''}</p>`).join('')}</div></details>`;
      };
      const notas = ver('nota').map((a) => `<p class="ayuda-chips"><b>${escapar(a.nombre)}:</b> ${escapar(a.positivos)} ${a.negativos ? '<br>' + escapar(a.negativos) : ''} ${a.detalle ? '<br>' + (enlaces(a.detalle) || escapar(a.detalle)) : ''}</p>`).join('');
      return acceso + `<h3 class="titulo-bloque">🕵️ Experto en apps familiares · ${fecha}</h3>${notas}
        <h3 class="titulo-bloque">🏁 La competencia: lo bueno y lo malo</h3>${comp}
        ${bloque('hueco', '🎯', 'Huecos que nadie cubre bien', true)}
        ${bloque('pon', '✅', 'Qué pondría', true)}
        ${bloque('quita', '✂️', 'Qué quitaría o evitaría', false)}
        ${bloque('consejo', '🏆', 'Consejos para ser los mejores', true)}`;
    }


    // ---- Familias: quién tiene la app y qué módulos son gratis o de pago ----
    const NOMBRE_PLAN = { gratis: '🆓 Gratis', prueba: '🧪 Prueba', premium: '⭐ De pago' };
    const SIGUIENTE_PLAN = { gratis: 'premium', premium: 'prueba', prueba: 'gratis' };

    function htmlFamilias() {
      const reales = familias.filter((f) => !f.es_prueba);
      const pruebas = familias.length - reales.length;
      const total = reales.length;
      const hoy = Date.now();
      const rs = (k) => { const x = appResumen.find((a) => a.clave === k); return x ? x.valor : 0; };
      const dias = (f) => (f ? (hoy - new Date(f + 'T12:00:00').getTime()) / 86400000 : 9999);
      const n = (plan) => reales.filter((f) => f.plan === plan).length;
      const activas = reales.filter((f) => dias(f.ultimo_uso) <= 30).length;
      const nuevas = reales.filter((f) => dias(f.alta) <= 7).length;
      const personas = reales.reduce((a, f) => a + (f.miembros || 0), 0);
      const kpi = (num, txt, color) => `<div class="kpi" style="border-color:${color}"><b>${numES(num)}</b><span>${txt}</span></div>`;
      const filas = familias.map((f) => `<div class="fila-fam" data-fam="${f.id}">
          <div class="fam-datos"><b>${escapar(f.nombre)}</b><small>${f.es_prueba ? '🧪 Pruebas · ' : ''}${f.email ? escapar(f.email) + ' · ' : ''}${f.miembros} persona${f.miembros === 1 ? '' : 's'} · alta ${new Date(f.alta + 'T12:00:00').toLocaleDateString('es-ES')}${f.ultimo_uso ? ' · último uso ' + new Date(f.ultimo_uso + 'T12:00:00').toLocaleDateString('es-ES') : ''}${f.origen ? ' · ' + escapar(f.origen) : ''}</small>${f.notas ? `<small>📝 ${escapar(f.notas)}</small>` : ''}</div>
          <div class="acciones"><button class="secundario" data-accion="fam_plan" data-id-fam="${f.id}">${NOMBRE_PLAN[f.plan]} → ${NOMBRE_PLAN[SIGUIENTE_PLAN[f.plan]]}</button>
            <button class="secundario" data-accion="fam_borrar" data-id-fam="${f.id}">Quitar</button></div></div>`).join('');
      const modulos = planesF.map((m) => `<div class="fila-mod">
          <div class="mod-texto"><b>${m.icono || ''} ${escapar(m.modulo)}</b><small>${escapar(m.descripcion || '')}${m.limite_gratis ? ' · <i>Gratis: ' + escapar(m.limite_gratis) + '</i>' : ''}</small></div>
          <div class="mod-cols"><button class="chip ${m.gratis ? 'verde' : 'gris'}" data-accion="plan_mod" data-modulo="${escapar(m.modulo)}" data-col="gratis">${m.gratis ? '✔' : '○'} Gratis</button>
            <button class="chip ${m.premium ? 'amarillo' : 'gris'}" data-accion="plan_mod" data-modulo="${escapar(m.modulo)}" data-col="premium">${m.premium ? '✔' : '○'} De pago</button></div></div>`).join('');
      const nGratis = planesF.filter((m) => m.gratis).length;
      const NOMBRE_ESPERA = { pendiente: '🟡 Por invitar', invitado: '🟢 Invitado', descartado: '⚪ Descartado' };
      const filasEspera = listaEspera.map((e) => `<div class="fila-fam ${e.estado}">
          <div class="fam-datos"><b>${NOMBRE_ESPERA[e.estado]} · <a href="mailto:${escapar(e.email)}">${escapar(e.email)}</a></b>
            <small>${e.nombre ? escapar(e.nombre) + ' · ' : ''}se apuntó el ${new Date(e.fecha + 'T12:00:00').toLocaleDateString('es-ES')}${e.origen ? ' · ' + escapar(e.origen) : ''}${e.codigo ? ' · código ' + escapar(e.codigo) : ''}</small>
            ${e.mensaje ? `<small>💬 ${escapar(e.mensaje)}</small>` : ''}${e.notas ? `<small>📝 ${escapar(e.notas)}</small>` : ''}</div>
          <div class="acciones">${e.estado === 'pendiente'
            ? `<button class="principal" data-accion="espera_invitar" data-id-esp="${e.id}">Ya invitado (apuntar código)</button><button class="secundario" data-accion="espera_estado" data-id-esp="${e.id}" data-estado="descartado">Descartar</button>`
            : `<button class="secundario" data-accion="espera_estado" data-id-esp="${e.id}" data-estado="pendiente">Volver a «por invitar»</button>`}</div></div>`).join('');
      return `<div class="resumen-redes"><div class="total-redes"><span>Familias con PEPA (de clientes)</span><b>${numES(total)}</b></div>
          <p class="ayuda-chips">Además hay ${pruebas} familias internas de pruebas y demo (no cuentan). ${numES(rs('interesados_web'))} persona(s) en la lista de espera de la web · ${numES(rs('visitas_web'))} visitas a la web · ${numES(rs('cuentas_con_usuario'))} cuentas de usuario creadas · ${numES(rs('avisos_activados'))} móviles con avisos.</p>
          <div class="kpis">${kpi(personas, 'personas en total', '#6c5ce7')}${kpi(n('gratis'), 'gratis', '#2f7d5b')}${kpi(n('premium'), 'de pago', '#e8a317')}${kpi(n('prueba'), 'en prueba', '#1877f2')}${kpi(activas, 'activas (30 días)', '#c13584')}${kpi(nuevas, 'nuevas (7 días)', '#e53935')}</div>
          <p class="ayuda-chips">Bartolo importa las familias de la app cada día (solo nombre, número de personas y fechas; nada de datos privados).</p></div>
        <h3 class="titulo-bloque">📬 Lista de espera (${listaEspera.filter((e) => e.estado === 'pendiente').length} por invitar)</h3>
        <p class="ayuda-chips">Gente que ha dejado su correo en la web. Escríbeles, dales su código de invitación y toca «Ya invitado». Bartolo añade aquí los nuevos cada día.</p>
        <div class="lista-fam">${filasEspera || '<p class="vacio">Nadie en la lista de espera todavía.</p>'}</div>
        <h3 class="titulo-bloque">👨‍👩‍👧 Familias</h3>
        <details class="carpeta verde"><summary><span class="carpeta-icono">➕</span><span class="carpeta-nombre">Apuntar una familia a mano (solo si no está en la app)</span></summary>
          <div class="form-fam">
            <label for="fam-nombre">Nombre de la familia</label><input id="fam-nombre" placeholder="Familia García">
            <label for="fam-email">Correo (opcional)</label><input id="fam-email" type="email" placeholder="correo@ejemplo.com">
            <label for="fam-miembros">Personas</label><input id="fam-miembros" type="number" min="1" max="30" value="4" inputmode="numeric">
            <label for="fam-origen">Cómo nos conoció (opcional)</label><input id="fam-origen" placeholder="TikTok, Instagram, web…">
            <div class="acciones"><button class="principal" data-accion="fam_add">Añadir familia</button></div>
          </div></details>
        <div class="lista-fam">${filas || '<p class="vacio">Todavía no hay familias apuntadas.</p>'}</div>
        <h3 class="titulo-bloque">🧩 Qué lleva cada plan (${nGratis} módulos gratis de ${planesF.length})</h3>
        <p class="ayuda-chips">Toca para marcar qué es gratis y qué es de pago. Propuesta inicial basada en el análisis de la competencia: gratis lo básico para organizar la casa; de pago lo que ahorra más tiempo.</p>
        <div class="lista-mod">${modulos}</div>`;
    }

    async function accionFamilias(boton) {
      const accion = boton.dataset.accion;
      if (accion === 'fam_add') {
        const nombre = ($('fam-nombre').value || '').trim();
        if (!nombre) { avisar('Escribe el nombre de la familia.'); return; }
        const fila = { nombre, email: ($('fam-email').value || '').trim() || null, miembros: parseInt($('fam-miembros').value, 10) || 1, origen: ($('fam-origen').value || '').trim() || null };
        const { data, error } = await sb.from('familias').insert(fila).select().single();
        if (error) { avisar('No se pudo guardar: ' + error.message); return; }
        familias.unshift(data); avisar('');
      } else if (accion === 'fam_plan') {
        const f = familias.find((x) => x.id === boton.dataset.idFam); if (!f) return;
        const nuevo = SIGUIENTE_PLAN[f.plan];
        const { error } = await sb.from('familias').update({ plan: nuevo }).eq('id', f.id);
        if (error) { avisar('No se pudo cambiar el plan: ' + error.message); return; }
        f.plan = nuevo; avisar('');
      } else if (accion === 'fam_borrar') {
        const f = familias.find((x) => x.id === boton.dataset.idFam); if (!f) return;
        if (!confirm(`¿Quitar a ${f.nombre} de la lista?`)) return;
        const { error } = await sb.from('familias').delete().eq('id', f.id);
        if (error) { avisar('No se pudo quitar: ' + error.message); return; }
        familias = familias.filter((x) => x.id !== f.id); avisar('');
      } else if (accion === 'espera_invitar' || accion === 'espera_estado') {
        const e = listaEspera.find((x) => x.id === boton.dataset.idEsp); if (!e) return;
        let cambios;
        if (accion === 'espera_invitar') {
          const cod = prompt(`Código de invitación que le has dado a ${e.email} (puedes dejarlo vacío):`, e.codigo || '');
          if (cod === null) return;
          cambios = { estado: 'invitado', codigo: cod.trim() || null };
        } else { cambios = { estado: boton.dataset.estado }; }
        const { error } = await sb.from('lista_espera').update(cambios).eq('id', e.id);
        if (error) { avisar('No se pudo guardar: ' + error.message); return; }
        Object.assign(e, cambios); avisar('');
      } else if (accion === 'plan_mod') {
        const m = planesF.find((x) => x.modulo === boton.dataset.modulo); if (!m) return;
        const col = boton.dataset.col; const nuevo = !m[col];
        const { error } = await sb.from('planes_funciones').update({ [col]: nuevo }).eq('modulo', m.modulo);
        if (error) { avisar('No se pudo guardar: ' + error.message); return; }
        m[col] = nuevo; avisar('');
      }
      pintar();
    }

    // Vistas: cada cosa en su pestaña para que la pantalla no sea una lista interminable.
    let vista = 'videos';
    try { vista = localStorage.getItem('cmr_vista') || 'videos'; } catch (e) { /* sin almacenamiento */ }

    // Un guion está "creado" cuando su vídeo ya está subido al panel; si no, "sin crear".
    function tieneVideo(g) { return !!g.video_archivado || videosLib.some((o) => o.name === `${g.codigo}.mp4`); }


    // Espacio de vídeos en Supabase (plan gratuito: 1 GB). Aviso a partir del 85 %.
    const LIMITE_ALMACEN = 1024 * 1024 * 1024;
    function usoAlmacen() {
      const usado = videosLib.reduce((a, v) => a + ((v.metadata && v.metadata.size) || 0), 0);
      return { usado, pct: Math.round((usado / LIMITE_ALMACEN) * 100) };
    }
    function htmlAlmacen(siempre) {
      const { usado, pct } = usoAlmacen();
      if (!usado) return '';
      const mb = Math.round(usado / 1048576);
      if (pct >= 85) {
        return `<div class="aviso-almacen alto">⚠️ El espacio de vídeos está al ${pct} % (${mb} MB de 1.024 MB). Cuando se llene no se podrán subir más vídeos. Borra vídeos antiguos ya publicados (los tienes en tu ordenador) o pide ayuda a Bartolo.</div>`;
      }
      return siempre ? `<p class="ayuda-chips">💾 Espacio de vídeos: ${pct} % usado (${mb} MB de 1.024 MB del plan gratuito). Te avisaré aquí al llegar al 85 %.</p>` : '';
    }

    function htmlPestanas() {
      const nCal = publicaciones.filter((p) => ['pendiente', 'manual', 'error'].includes(p.estado)).length;
      const nCre = guiones.filter((g) => tieneVideo(g) && g.estado !== 'rechazado').length;
      const nSin = guiones.filter((g) => !tieneVideo(g) && g.estado !== 'rechazado').length;
      const tabs = [
        ['videos', `Vídeos (${videosLib.length})`],
        ['calendario', `Calendario${nCal ? ` (${nCal})` : ''}`],
        ['guiones', `Guiones creados (${nCre})`],
        ['sin_crear', `Guiones sin crear (${nSin})`],
        ['redes', '📊 Redes'],
        ['web', '🌐 Web'],
        ['app', '📱 App'],
        ['familias', '👨‍👩‍👧 Familias'],
        ['pedir', 'Pedir guiones'],
      ];
      return `<div class="pestanas">${tabs.map(([k, n]) =>
        `<button class="${k === vista ? 'activa' : ''}" data-accion="vista" data-vista="${k}">${n}</button>`).join('')}</div>`;
    }

    function pintar() {
      let cuerpo;
      if (vista === 'calendario') cuerpo = htmlCalendario();
      else if (vista === 'redes') cuerpo = htmlRedes();
      else if (vista === 'web') cuerpo = htmlWeb();
      else if (vista === 'app') cuerpo = htmlApp();
      else if (vista === 'familias') cuerpo = htmlFamilias();
      else if (vista === 'pedir') cuerpo = htmlPeticion();
      else if (vista === 'guiones' || vista === 'sin_crear') {
        const sinCrear = vista === 'sin_crear';
        const carp = {
          amarillo: { icono: '🟡', nombre: 'No publicados', ayuda: 'En preparación o pendientes: todavía no han salido en ninguna red', items: [] },
          medias: { icono: '🟠', nombre: 'Publicados, faltan redes', ayuda: 'Ya salieron en alguna red pero faltan otras. Cuando estén en las 4 pasan solos a la tarjeta verde', items: [] },
          verde: { icono: '🟢', nombre: 'Publicados en las 4 redes', ayuda: 'Terminados', items: [] },
          gris: { icono: '⚪', nombre: 'Rechazados', ayuda: 'Descartados', items: [] },
        };
        [...guiones].filter((g) => tieneVideo(g) !== sinCrear).sort((a, b) => b.codigo.localeCompare(a.codigo)).forEach((g) => {
          const ev = estadoVideo(g);
          const hechas = ev.redes.filter(([, c]) => c === 'verde').length;
          const k = g.estado === 'rechazado' ? 'gris' : (ev.color === 'verde' ? 'verde' : hechas ? 'medias' : 'amarillo');
          if (k === 'medias') { const f = ev.redes.filter(([, c]) => c !== 'verde').map(([r]) => r); carp[k].items.push(htmlTarjeta(g).replace('</article>', `<div class="aviso-manual">⏳ Falta en: ${escapar(nombresRedes(f))}</div></article>`)); }
          else carp[k].items.push(htmlTarjeta(g));
        });
        cuerpo = (sinCrear ? '<div class="leyenda">Guiones que aún no tienen vídeo. Cuando se suba el vídeo pasan solos a "Guiones creados".</div>'
          : '<div class="leyenda">🟢 Publicado en las 4 redes &nbsp; 🟠 Publicado, faltan redes &nbsp; 🟡 Sin publicar</div>')
          + (['amarillo', 'medias', 'verde', 'gris'].filter((k) => carp[k].items.length).map((k) =>
            `<details class="carpeta ${k}" ${k === 'amarillo' || k === 'medias' ? 'open' : ''}>
              <summary><span class="carpeta-icono">${carp[k].icono}</span><span class="carpeta-nombre">${carp[k].nombre}</span>
                <span class="carpeta-num">${carp[k].items.length}</span></summary>
              <div class="carpeta-ayuda">${carp[k].ayuda}</div>
              <div class="lista">${carp[k].items.join('')}</div>
            </details>`).join('') || `<p class="vacio">${sinCrear ? 'No hay guiones sin crear.' : 'No hay guiones creados.'}</p>`);
      } else cuerpo = htmlBiblioteca();
      const campo = $('num-guiones');
      const valor = campo ? campo.value : '';
      $('contenido').innerHTML = htmlAlmacen(false) + htmlPestanas() + (vista === 'redes' ? htmlAlmacen(true) : '') + cuerpo;
      if (valor && $('num-guiones')) $('num-guiones').value = valor;
      cargarVideos();
    }

    // Los vídeos están en un bucket privado: se reproducen con una URL firmada de 1 hora.
    async function cargarVideos() {
      for (const v of document.querySelectorAll('video[data-ruta]')) {
        const { data } = await sb.storage.from(BUCKET_VIDEOS).createSignedUrl(v.dataset.ruta, 3600);
        if (data && data.signedUrl) v.src = data.signedUrl;
        else v.insertAdjacentHTML('afterend', '<p class="vacio">No se pudo cargar el vídeo.</p>');
      }
    }

    async function cargarBiblioteca() {
      const { data } = await sb.storage.from(BUCKET_VIDEOS)
        .list('', { limit: 200, sortBy: { column: 'created_at', order: 'desc' } });
      videosLib = (data || []).filter((o) => /\.mp4$/i.test(o.name));
    }

    async function accionBiblioteca(accion, boton) {
      const ruta = boton.dataset.ruta;
      if (accion === 'subir_videos') {
        const archivos = [...($('archivo-video').files || [])];
        if (!archivos.length) { avisar('Elige primero uno o más vídeos.'); return; }
        // Los vídeos que no se llaman G-###.mp4 reciben solos el siguiente número libre,
        // en el orden en que se crearon los archivos. Así se pueden subir de golpe los de Flow.
        const num = (c) => parseInt(String(c).replace(/\D/g, ''), 10) || 0;
        let ultimo = Math.max(0, ...guiones.map((x) => num(x.codigo)), ...videosLib.map((v) => num(v.name)));
        archivos.sort((a, b) => (a.lastModified - b.lastModified) || a.name.localeCompare(b.name));
        const hechos = [];
        for (const f of archivos) {
          if (!/\.mp4$/i.test(f.name)) { avisar(`"${f.name}" no se sube: solo se admiten vídeos .mp4.`); break; }
          if (f.size > 50 * 1048576) { avisar(`"${f.name}" pesa más de 50 MB.`); break; }
          const m = f.name.match(/^(G-\d{3})\.mp4$/i);
          let cod;
          let nuevo = false;
          if (m) cod = m[1].toUpperCase();
          else { ultimo += 1; cod = 'G-' + String(ultimo).padStart(3, '0'); nuevo = true; }
          avisar(`Subiendo ${hechos.length + 1} de ${archivos.length}: ${cod}…`);
          const { error } = await sb.storage.from(BUCKET_VIDEOS)
            .upload(cod + '.mp4', f, { upsert: !nuevo, contentType: 'video/mp4' });
          if (error) { avisar(`No se pudo subir ${f.name}: ${error.message}`); break; }
          let g = guiones.find((x) => x.codigo === cod);
          if (!g) {
            const titulo = f.name.replace(/\.mp4$/i, '').replace(/[_-]+/g, ' ').trim().slice(0, 80) || cod;
            const { error: e2 } = await sb.from('guiones').insert({
              codigo: cod, titulo, guion: 'Vídeo subido directamente al panel, sin guion.',
              prompt_flow: 'Vídeo creado a mano por el usuario.', personajes: [],
              texto_publicacion: '', hashtags: '', estado: 'pendiente_revision',
            });
            if (e2) { avisar(`Se subió ${cod}, pero no se pudo crear su ficha: ${e2.message}`); break; }
          } else if (['aprobado_guion', 'video_subido'].includes(g.estado)) {
            // Un vídeo nuevo de un guion aprobado pasa a "Revisar vídeo".
            await actualizar(g.id, { estado: 'pendiente_revision' });
          }
          hechos.push(nuevo ? `${f.name} → ${cod}` : cod);
        }
        const { data: gs } = await sb.from('guiones').select('*').order('codigo');
        if (gs) guiones = gs;
        await cargarBiblioteca();
        if (hechos.length && hechos.length === archivos.length) avisar(`Subidos ${hechos.length}: ${hechos.join(', ')}`);
        else if (hechos.length) avisar(`Se subieron ${hechos.length} de ${archivos.length} (${hechos.join(', ')}). Los demás no: mira el motivo arriba y vuelve a elegirlos.`);
      } else if (accion === 'ver_video') {
        const visor = boton.closest('.pub').querySelector('.visor');
        // Segundo toque en "Ver": esconde el vídeo (y para su reproducción).
        if (visor.innerHTML.trim()) {
          const v = visor.querySelector('video');
          if (v) { v.pause(); v.removeAttribute('src'); v.load(); }
          visor.innerHTML = '';
          boton.textContent = '▶ Ver';
          return;
        }
        const { data } = await sb.storage.from(BUCKET_VIDEOS).createSignedUrl(ruta, 3600);
        if (!data) { avisar('No se pudo abrir el vídeo.'); return; }
        visor.innerHTML = `<video class="reproductor" controls playsinline src="${escapar(data.signedUrl)}"></video>`;
        boton.textContent = '▲ Esconder';
        return;
      } else if (accion === 'descargar_video') {
        const url = await signedUrlDescarga(ruta.replace(/\.mp4$/i, ''));
        if (url) window.open(url, '_blank');
        return;
      } else if (accion === 'archivar_video' || accion === 'archivar_todos') {
        const verdes = guiones.filter((g) => videosLib.some((v) => v.name === g.codigo + '.mp4') && estadoVideo(g).color === 'verde');
        const lista = accion === 'archivar_video' ? verdes.filter((g) => g.codigo + '.mp4' === ruta) : verdes;
        if (!lista.length) { avisar('No hay vídeos publicados en las 4 redes para quitar.'); return; }
        const quien = lista.length === 1 ? `el vídeo ${lista[0].codigo}` : `${lista.length} vídeos (${lista.slice(0, 6).map((g) => g.codigo).join(', ')}${lista.length > 6 ? '…' : ''})`;
        if (!confirm(`Vas a borrar de Supabase ${quien}.\n\nLa ficha, las redes y el calendario se quedan en el panel, pero el archivo de vídeo NO se puede recuperar desde aquí.\n\n¿Lo tienes guardado en tu ordenador?`)) return;
        let hechos = 0;
        for (const g of lista) {
          const { data, error } = await sb.storage.from(BUCKET_VIDEOS).remove([g.codigo + '.mp4']);
          if (error || !data || !data.length) { avisar('No se pudo quitar ' + g.codigo + '.'); break; }
          const { error: e2 } = await sb.from('guiones').update({ video_archivado: true }).eq('id', g.id);
          if (e2) { avisar('Se quitó el archivo de ' + g.codigo + ' pero no se pudo anotar: ' + e2.message); break; }
          g.video_archivado = true;
          hechos++;
        }
        if (hechos) avisar(`Listo: ${hechos} vídeo(s) quitado(s) de Supabase. Siguen en el panel como archivados.`);
        await cargarBiblioteca();
      } else if (accion === 'borrar_video') {
        if (!confirm(`¿Seguro que quieres eliminar el vídeo ${ruta} de la biblioteca?`)) return;
        const { data, error } = await sb.storage.from(BUCKET_VIDEOS).remove([ruta]);
        if (error || !data || !data.length) { avisar('No se pudo eliminar el vídeo.'); return; }
        avisar('');
        await cargarBiblioteca();
      }
      pintar();
    }

    async function recargarPublicaciones() {
      const { data } = await sb.from('publicaciones').select('*').order('programado_para');
      publicaciones = data || [];
    }

    async function signedUrlDescarga(codigo) {
      const { data, error } = await sb.storage.from(BUCKET_VIDEOS)
        .createSignedUrl(codigo + '.mp4', 600, { download: codigo + '.mp4' });
      if (error || !data) { avisar('No se pudo preparar la descarga: ' + (error ? error.message : '')); return null; }
      return data.signedUrl;
    }

    async function cargarPendientes() {
      const { count, error } = await sb.from('peticiones_guiones')
        .select('id', { count: 'exact', head: true }).eq('estado', 'pendiente');
      pendientes = error ? 0 : (count || 0); // sin tabla aún: no se avisa
    }

    async function pedirGuiones() {
      const n = parseInt($('num-guiones').value, 10);
      if (!Number.isInteger(n) || n < 1 || n > MAX_PETICION) {
        avisar(`Elige un número entre 1 y ${MAX_PETICION}.`);
        return;
      }
      const { error } = await sb.from('peticiones_guiones').insert({ cantidad: n });
      if (error) { avisar('No se pudo guardar la petición: ' + error.message); return; }
      avisar('');
      await cargarPendientes();
      alert(`Petición de ${n} guiones guardada. Dile a Claude: «genera los guiones pendientes».`);
    }

    async function cargar() {
      const { data, error } = await sb.from('guiones').select('*').order('codigo');
      $('cargando').hidden = true;
      $('contenido').hidden = false;
      if (error) { avisar('No se pudieron leer los guiones: ' + error.message); return; }
      avisar('');
      guiones = data || [];
      await cargarPendientes();
      await recargarPublicaciones();
      await cargarBiblioteca();
      for (const g of guiones.filter((x) => x.video_archivado && videosLib.some((v) => v.name === x.codigo + '.mp4'))) {
        const { error: e0 } = await sb.from('guiones').update({ video_archivado: false }).eq('id', g.id);
        if (!e0) g.video_archivado = false;
      }
      // Todo vídeo G-###.mp4 de la biblioteca sin ficha recibe una: aparece en Vídeos y en Guiones
      // como "no publicado" (pendiente de revisión), con las mismas opciones para publicarlo.
      const sinFicha = videosLib.map((v) => v.name.replace(/\.mp4$/i, '').toUpperCase())
        .filter((c) => /^G-\d{3}$/.test(c) && !guiones.some((g) => g.codigo === c));
      if (sinFicha.length) {
        const { error: e3 } = await sb.from('guiones').insert(sinFicha.map((c) => ({
          codigo: c, titulo: 'Vídeo ' + c, guion: 'Vídeo subido directamente al panel, sin guion.',
          prompt_flow: 'Vídeo creado a mano por el usuario.', personajes: [],
          texto_publicacion: '', hashtags: '', estado: 'pendiente_revision',
        })));
        if (!e3) {
          const { data: gs2 } = await sb.from('guiones').select('*').order('codigo');
          if (gs2) guiones = gs2;
        }
      }
      try {
        const [r1, r2, r3, r4, r5, r6, r7, r8, r9] = await Promise.all([
          sb.from('estadisticas_resumen').select('*'),
          sb.from('estadisticas_videos').select('*').order('vistas', { ascending: false }).limit(500),
          sb.from('ideas_virales').select('*').order('fecha', { ascending: false }).order('id', { ascending: true }).limit(60),
          sb.from('estadisticas_diarias').select('*').order('fecha', { ascending: false }).limit(240),
          sb.from('analisis_app').select('*').order('orden', { ascending: true }),
          sb.from('familias').select('*').order('alta', { ascending: false }),
          sb.from('planes_funciones').select('*').order('orden', { ascending: true }),
          sb.from('app_resumen').select('*'),
          sb.from('lista_espera').select('*').order('fecha', { ascending: false }),
        ]);
        statsRes = r1.data || [];
        statsVid = r2.data || [];
        ideasViral = r3.data || [];
        statsDia = r4.data || [];
        analisisApp = r5.data || [];
        familias = r6.data || [];
        planesF = r7.data || [];
        appResumen = r8.data || [];
        listaEspera = r9.data || [];
      } catch (e) { /* sin estadísticas todavía */ }
      pintar();
    }

    async function actualizar(id, cambios) {
      const { error } = await sb.from('guiones').update(cambios).eq('id', id);
      if (error) { avisar('No se pudo guardar: ' + error.message); return false; }
      avisar('');
      Object.assign(guiones.find((g) => g.id === id), cambios);
      return true;
    }

    async function eliminar(id) {
      // Con RLS, un borrado no permitido no da error: devuelve 0 filas.
      const { data, error } = await sb.from('guiones').delete().eq('id', id).select('id');
      if (error) { avisar('No se pudo eliminar: ' + error.message); return false; }
      if (!data || !data.length) { avisar('No se pudo eliminar: no tienes permiso para borrar guiones.'); return false; }
      avisar('');
      guiones = guiones.filter((g) => g.id !== id);
      return true;
    }

    $('contenido').addEventListener('click', async (ev) => {
      const boton = ev.target.closest('button[data-accion]');
      if (!boton) return;
      if (['subir_videos', 'ver_video', 'descargar_video', 'borrar_video', 'archivar_video', 'archivar_todos'].includes(boton.dataset.accion)) {
        boton.disabled = true;
        try { await accionBiblioteca(boton.dataset.accion, boton); } finally { boton.disabled = false; }
        return;
      }
      if (boton.dataset.accion === 'vista') {
        vista = boton.dataset.vista;
        try { localStorage.setItem('cmr_vista', vista); } catch (e) { /* sin almacenamiento */ }
        pintar();
        return;
      }
      if (boton.dataset.accion === 'cambiar_hora') {
        boton.disabled = true;
        try {
          const campo = boton.closest('.pub').querySelector('[data-hora]');
          const nueva = campo && campo.value ? new Date(campo.value) : null;
          if (!nueva || isNaN(nueva.getTime())) { avisar('Elige una fecha y hora válidas.'); return; }
          if (!confirm(`¿Confirmas esta fecha y hora de publicación: ${fechaEs(nueva.toISOString())}?`)) return;
          const { error } = await sb.from('publicaciones').update({ programado_para: nueva.toISOString() }).eq('id', boton.dataset.pub);
          if (error) { avisar('No se pudo cambiar la fecha: ' + error.message); return; }
          avisar('');
          await recargarPublicaciones();
          pintar();
        } finally { boton.disabled = false; }
        return;
      }
      if (boton.dataset.accion === 'pedir') {
        boton.disabled = true;
        try { await pedirGuiones(); } finally { boton.disabled = false; }
        pintar();
        return;
      }
      if (['fam_add', 'fam_plan', 'fam_borrar', 'plan_mod', 'espera_invitar', 'espera_estado'].includes(boton.dataset.accion)) { await accionFamilias(boton); return; }
      if (boton.dataset.accion === 'ocultar_video') {
        // Esconde o muestra el reproductor de esta tarjeta (al esconderlo, se para).
        const vid = boton.closest('[data-id]').querySelector('video.reproductor');
        if (!vid) return;
        if (vid.hidden) { vid.hidden = false; boton.textContent = '▲ Esconder vídeo'; }
        else { vid.pause(); vid.hidden = true; boton.textContent = '▶ Ver vídeo'; }
        return;
      }
      const tarjeta = boton.closest('[data-id]');
      const id = tarjeta.dataset.id;
      const g = guiones.find((x) => x.id === id);
      const accion = boton.dataset.accion;
      boton.disabled = true;
      try {
        if (accion === 'aprobar') {
          await actualizar(id, { estado: 'aprobado_guion', motivo_rechazo: null });
        } else if (accion === 'rechazar') {
          const motivo = prompt('¿Por qué lo rechazas? (opcional)');
          if (motivo === null) return;
          await actualizar(id, { estado: 'rechazado', motivo_rechazo: motivo.trim() || null });
        } else if (accion === 'aprobar_video') {
          const campoFecha = tarjeta.querySelector('[data-campo=fecha]');
          // El aviso sale como ventana delante de la pantalla (el aviso de arriba no se ve desde una tarjeta lejana).
          const falta = (msg, campo) => {
            alert(msg);
            if (campo) { campo.scrollIntoView({ block: 'center' }); campo.style.outline = '3px solid #ef4444'; campo.focus(); }
          };
          const v = campoFecha.value;
          const hora = new Date(v);
          if (!v || isNaN(hora.getTime())) { falta('Antes elige la FECHA y la HORA de publicación en el campo de esta tarjeta. No se publica nada sin ella.', campoFecha); return; }
          campoFecha.style.outline = '';
          if (hora.getTime() < Date.now() - 60000) { falta('Esa fecha y hora ya han pasado. Elige una futura.', campoFecha); return; }
          const redes = [...tarjeta.querySelectorAll('[data-plataforma]:checked')].map((x) => x.dataset.plataforma);
          if (!redes.length) { alert('Marca al menos una red donde publicar.'); return; }
          if (!confirm(`¿Confirmas publicar ${g.codigo} en ${redes.map((r) => NOMBRE_PLAT[r]).join(', ')} el ${fechaEs(hora.toISOString())}?`)) return;
          const filas = redes.map((r) => ({
            guion_id: id, plataforma: r, ruta_video: g.codigo + '.mp4',
            programado_para: hora.toISOString(), estado: MANUALES.includes(r) ? 'manual' : 'pendiente',
          }));
          const { error } = await sb.from('publicaciones').insert(filas);
          if (error) { avisar('No se pudo programar: ' + error.message); return; }
          if (await actualizar(id, { estado: 'aprobado_publicar', motivo_rechazo: null })) await recargarPublicaciones();
        } else if (accion === 'reintentar') {
          const { error } = await sb.from('publicaciones').update({ estado: 'pendiente' }).eq('id', boton.dataset.pub);
          if (error) { avisar('No se pudo reintentar: ' + error.message); return; }
          await recargarPublicaciones();
        } else if (accion === 'manual_descargar') {
          const url = await signedUrlDescarga(g.codigo);
          if (url) window.open(url, '_blank');
          return;
        } else if (accion === 'manual_copiar') {
          try {
            await navigator.clipboard.writeText(`${g.texto_publicacion || ''}\n\n${g.hashtags || ''}\n\nVídeo creado con inteligencia artificial.`.trim());
            boton.textContent = '¡Copiado!';
            setTimeout(() => { boton.textContent = 'Copiar texto'; }, 1500);
          } catch (e) {
            avisar('No se pudo copiar automáticamente; abre "Texto de publicación" y cópialo a mano.');
          }
          return;
        } else if (accion === 'programar_red') {
          const red = tarjeta.querySelector('[data-nueva-red]').value;
          const v = tarjeta.querySelector('[data-nueva-hora]').value;
          const hora = new Date(v);
          if (!v || isNaN(hora.getTime())) { avisar('Elige tú la fecha y la hora. No se publica nada sin ella.'); return; }
          if (!confirm(`¿Confirmas publicar ${g.codigo} en ${NOMBRE_PLAT[red] || red} el ${fechaEs(hora.toISOString())}?`)) return;
          const { error } = await sb.from('publicaciones').insert({
            guion_id: id, plataforma: red, ruta_video: g.codigo + '.mp4',
            programado_para: hora.toISOString(), estado: MANUALES.includes(red) ? 'manual' : 'pendiente',
          });
          if (error) { avisar('No se pudo programar: ' + error.message); return; }
          // Para que el cron pueda publicarlo, el guion debe estar aprobado para publicar.
          if (g.estado !== 'aprobado_publicar') await actualizar(id, { estado: 'aprobado_publicar' });
          await recargarPublicaciones();
        } else if (accion === 'manual_hecho') {
          const { error } = await sb.from('publicaciones')
            .update({ estado: 'publicado', publicado_en: new Date().toISOString() }).eq('id', boton.dataset.pub);
          if (error) { avisar('No se pudo marcar: ' + error.message); return; }
          await recargarPublicaciones();
          const abiertas = publicaciones.filter((p) => p.guion_id === id && ['pendiente', 'publicando', 'manual', 'error'].includes(p.estado));
          if (!abiertas.length) await actualizar(id, { estado: 'publicado' });
        } else if (accion === 'marcar_red') {
          // Marca o desmarca "publicado" en una red a mano; con las cuatro marcadas el guion pasa a publicado.
          const red = boton.dataset.red;
          const filas = publicaciones.filter((p) => p.guion_id === id && p.plataforma === red);
          const ya = filas.some((p) => p.estado === 'publicado');
          const ahora = new Date().toISOString();
          if (ya) {
            if (!confirm(`¿Quitar la marca de publicado en ${NOMBRE_PLAT[red]}?`)) return;
            const { error } = await sb.from('publicaciones').delete().eq('guion_id', id).eq('plataforma', red).eq('estado', 'publicado');
            if (error) { avisar('No se pudo quitar: ' + error.message); return; }
          } else if (filas.length) {
            const { error } = await sb.from('publicaciones').update({ estado: 'publicado', publicado_en: ahora }).eq('id', filas[0].id);
            if (error) { avisar('No se pudo marcar: ' + error.message); return; }
          } else {
            const { error } = await sb.from('publicaciones').insert({
              guion_id: id, plataforma: red, ruta_video: g.codigo + '.mp4',
              programado_para: ahora, estado: 'publicado', publicado_en: ahora,
            });
            if (error) { avisar('No se pudo marcar: ' + error.message); return; }
          }
          await recargarPublicaciones();
          const todas = ORDEN_REDES.every((r) => publicaciones.some((p) => p.guion_id === id && p.plataforma === r && p.estado === 'publicado'));
          if (todas && g.estado !== 'publicado') await actualizar(id, { estado: 'publicado' });
          else if (!todas && g.estado === 'publicado') await actualizar(id, { estado: 'pendiente_revision' });
          avisar('');
        } else if (accion === 'eliminar_pub') {
          if (!confirm('¿Quitar esta publicación del calendario? Si ya estaba publicada, el vídeo seguirá en la red; solo desaparece de aquí.')) return;
          const { error } = await sb.from('publicaciones').delete().eq('id', boton.dataset.pub);
          if (error) { avisar('No se pudo eliminar: ' + error.message); return; }
          await recargarPublicaciones();
        } else if (accion === 'reabrir_pub') {
          if (!confirm('¿Marcarla como NO publicada? Volverá a "por publicar" (a mano).')) return;
          const { error } = await sb.from('publicaciones').update({ estado: 'manual', publicado_en: null }).eq('id', boton.dataset.pub);
          if (error) { avisar('No se pudo cambiar: ' + error.message); return; }
          await recargarPublicaciones();
        } else if (accion === 'eliminar') {
          if (!confirm(`¿Seguro que quieres eliminar ${g.codigo}?`)) return;
          await eliminar(id);
        } else if (accion === 'reabrir') {
          await actualizar(id, { estado: 'borrador', motivo_rechazo: null });
        } else if (accion === 'editar') {
          editando = id;
        } else if (accion === 'cancelar') {
          editando = null;
        } else if (accion === 'guardar') {
          const cambios = {};
          tarjeta.querySelectorAll('[data-campo]').forEach((el) => { cambios[el.dataset.campo] = el.value; });
          if (!cambios.titulo.trim() || !cambios.guion.trim() || !cambios.prompt_flow.trim()) {
            avisar('Título, guion y prompt no pueden quedar vacíos.');
            return;
          }
          if (await actualizar(id, cambios)) editando = null;
        } else if (accion === 'copiar') {
          try {
            await navigator.clipboard.writeText(g.prompt_flow);
            boton.textContent = '¡Copiado!';
            setTimeout(() => { boton.textContent = 'Copiar prompt'; }, 1500);
          } catch (e) {
            avisar('No se pudo copiar automáticamente; ábrelo en "Prompt para Flow" y cópialo a mano.');
          }
          return;
        }
        pintar();
      } finally {
        boton.disabled = false;
      }
    });

    $('contenido').addEventListener('change', (ev) => {
      if (ev.target.matches('[data-campo=cuando]')) {
        const fecha = ev.target.closest('[data-id]').querySelector('[data-campo=fecha]');
        fecha.hidden = ev.target.value !== 'fecha';
      }
    });

    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { location.replace('index.html'); return; }
      sb.auth.onAuthStateChange((_e, s) => { if (!s) location.replace('index.html'); });
      cargar();
    })();
  </script>
</body>
</html>
